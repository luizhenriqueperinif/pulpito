<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Telão</title>
<link rel="stylesheet" href="/comum/base.css">
<link rel="stylesheet" href="/comum/versiculo.css">
<style>
  /* O Telão nunca mostra o computador: fundo sempre preto, sem cursor, sem barras. */
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
  .camada { position: absolute; inset: 0; opacity: 0; transition: opacity .25s ease; display: grid; place-items: center; }
  .camada.visivel { opacity: 1; }
  #c-versiculo { display: block; }
  #c-versiculo .vs { position: absolute; inset: 0; }
  /* A imagem e o vídeo ocupam exatamente a tela da TV (nunca maiores que ela). */
  .camada img, .camada video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  /* Imagem: quase do formato da TV, preenche a tela; muito diferente (foto em pé), aparece inteira
     e o resto da tela é a própria foto desfocada, em vez de faixas pretas. */
  #c-imagem { overflow: hidden; }
  #img-fundo { position: absolute; inset: -6%; width: 112%; height: 112%; object-fit: cover; filter: blur(48px) brightness(.45) saturate(1.2); z-index: 0; }
  #c-imagem #img { z-index: 1; background: transparent; }
  #c-imagem #img.preencher { object-fit: cover; }
  #c-janela video { background: #000; }
  #espera-padrao {
    width: 100%; height: 100%; display: grid; place-content: center; text-align: center; gap: 2vw; color: #fff;
    background: linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.62)), url("/comum/fundos/amanhecer-dourado.jpg") center / cover no-repeat, #0f1d33;
    text-shadow: 0 .3vw 1.2vw rgba(0,0,0,.55);
  }
  #espera-padrao .h { font-size: 6.5vw; font-weight: 800; letter-spacing: -.01em; }
  #espera-img, #espera-video { object-fit: cover; width: 100%; height: 100%; }
  #espera-logo { position: static; inset: auto; height: auto; background: transparent; width: 22vw; max-height: 34vh; object-fit: contain; justify-self: center; filter: drop-shadow(0 .4vw 1.4vw rgba(0,0,0,.5)); }
  #espera-padrao .s { font-size: 2vw; color: rgba(255,255,255,.7); }
  @media (prefers-reduced-motion: reduce) { .camada { transition: none; } }
</style>
</head>
<body>
  <div class="camada" id="c-espera">
    <div id="espera-padrao"><img id="espera-logo" alt="" hidden><div class="h">Seja bem-vindo</div></div>
    <img id="espera-img" alt="" hidden>
    <video id="espera-video" muted loop playsinline hidden></video>
  </div>
  <div class="camada" id="c-imagem"><img id="img-fundo" alt="" hidden><img id="img" alt=""></div>
  <div class="camada" id="c-janela"><video id="janela" muted playsinline></video></div>
  <div class="camada" id="c-video"><video id="video" playsinline preload="auto"></video></div>
  <div class="camada" id="c-versiculo"></div>
  <!-- Música: só som, a TV continua mostrando o que estava -->
  <audio id="audio" preload="auto"></audio>
  <script src="/comum/conexao.js"></script>
  <script src="/comum/versiculo.js"></script>
  <script src="telao.js"></script>
</body>
</html>
